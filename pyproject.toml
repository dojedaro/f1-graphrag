[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "f1rag"
version = "0.1.0"
description = "Graph RAG vs. vector RAG on 26 seasons of Formula 1, scored against answers computed from the data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["networkx>=3.4", "numpy>=2.0", "anthropic>=2.8,<3", "sentence-transformers>=3.0"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
