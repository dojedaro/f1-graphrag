name: Showcase site
on:
  push:
    branches: [main]
    paths: ["site/**", "runs/**", "src/f1rag/site.py", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install networkx numpy
      - name: Bundle the saved eval run (no API calls)
        run: PYTHONPATH=src python -m f1rag.site runs/eval-2026-11-13 site/data/bundle.json runs/heldout-2026-11-13
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
