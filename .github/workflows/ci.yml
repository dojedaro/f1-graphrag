name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install (no embedding model needed for the offline tests)
        run: pip install networkx numpy pytest==9.2.0 ruff==0.17.4
      - run: ruff check src tests
      - name: Tests (graph, tools, question generator, scorer; no API calls)
        run: PYTHONPATH=src pytest -q
